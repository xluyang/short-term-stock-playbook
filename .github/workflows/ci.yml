name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -U ruff
      - run: ruff check .

  test:
    name: test ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # akshare 依赖较重且需要联网，CI 只装 pandas 验证纯逻辑
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e . --no-deps
          python -m pip install pandas pytest
      - name: Import smoke
        run: python -c "import short_term_stock_playbook, short_term_stock_playbook.pools, short_term_stock_playbook.score, short_term_stock_playbook.report; print('ok', short_term_stock_playbook.__version__)"
      - name: Unit tests
        run: pytest -q
      - name: CLI help
        run: python -m short_term_stock_playbook --help

  journal:
    name: journal generator smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install -U pip
          python -m pip install -e . --no-deps
          python -m pip install openpyxl pandas
      - name: Build xlsx
        run: python -m short_term_stock_playbook journal --out /tmp/journal.xlsx
      - name: Check file
        run: python -c "import pathlib,sys; p=pathlib.Path('/tmp/journal.xlsx'); sys.exit(0 if p.exists() and p.stat().st_size>4000 else 1)"
